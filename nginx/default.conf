server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location = /sun/admin {
        return 301 /sun/admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /sun/admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /sun/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /static/admin/simpleui-x/locale/zh-CN.js {
        alias /usr/share/nginx/html/static/admin/simpleui-x/elementui/umd/locale/zh-CN.js;
        access_log off;
        expires 30d;
    }

    location = /static/admin/simpleui-x/locale/ja.js {
        alias /usr/share/nginx/html/static/admin/simpleui-x/elementui/umd/locale/zh-CN.js;
        access_log off;
        expires 30d;
    }

    location = /sun/static/admin/simpleui-x/locale/zh-CN.js {
        alias /usr/share/nginx/html/static/admin/simpleui-x/elementui/umd/locale/zh-CN.js;
        access_log off;
        expires 30d;
    }

    location = /sun/static/admin/simpleui-x/locale/ja.js {
        alias /usr/share/nginx/html/static/admin/simpleui-x/elementui/umd/locale/zh-CN.js;
        access_log off;
        expires 30d;
    }

    location ^~ /sun/static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 30d;
    }

    location ^~ /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 30d;
    }

    # --- 案件ファイル（docs/SYSTEM_ARCHITECTURE.md §8） ---------------------------------
    # 公開の /media/ は廃止。ファイルは Django の /api/documents/{id}/download|preview/ で
    # 権限・監査を通したうえで X-Accel-Redirect により下の internal location から送る。
    # media_volume は Web ルートの外（/var/protected_media）にマウントし、try_files からも届かない。
    location ^~ /media/ {
        return 404;
    }

    location ^~ /sun/media/ {
        return 404;
    }

    location ^~ /_protected_media/ {
        internal;
        alias /var/protected_media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # 開発用の静的デバッグページは本番では配信しない。
    location ~ ^/(sun/)?(visa-form-field-mapping|visa-position-debug|zei-pdf-position-debug)\.html$ {
        return 404;
    }

    location /sun/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
